name: Lean build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Check sorry-index.json
        run: python3 scripts/sorry_index.py check

      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: false

      - name: Check axioms and sorry count
        run: |
          set -euo pipefail
          for f in LeapProofObligations/*.lean; do
            [ "$f" = LeapProofObligations/Definitions.lean ] && continue
            n=$(grep -cw sorry "$f" || true)
            [ "$n" = 1 ] || { echo "$f has $n sorry"; exit 1; }
          done
          if grep -rnE '^\s*axiom\s' LeapProofObligations; then exit 1; fi
          python3 - <<'PY' > /tmp/AxCheck.lean
          import json
          names = [s["theorem"] for s in json.load(open("sorry-index.json"))["sorries"]]
          print("import LeapProofObligations")
          for n in names:
              print(f"#print axioms {n}")
          PY
          lake env lean /tmp/AxCheck.lean | tee /tmp/axioms.txt
          if grep -oE 'axioms: \[[^]]*\]' /tmp/axioms.txt | tr -d '[]' | sed 's/axioms: //' | tr ',' '\n' \
              | sed 's/ //g' | grep -vxE 'propext|Classical.choice|Quot.sound|sorryAx' | grep .; then
            echo "unexpected axiom"; exit 1
          fi
